<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الكابتن</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
padding:20px;
direction:rtl;
background:#f5f5f5;
}

.card{

background:white;
padding:20px;

border-radius:20px;

margin-bottom:20px;

}

button{

padding:15px;
margin-top:10px;

border:none;

border-radius:10px;

color:white;

font-size:16px;

width:100%;

}

.start{
background:black;
}

.done{
background:green;
}

</style>

</head>

<body>

<h2>الطلبات</h2>

<div id="orders"></div>

<script>

const supabaseUrl =
'https://ckxljrwcsjmdflxyxxoc.supabase.co';

const supabaseKey =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0';

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

let watchId;

async function loadOrders(){

const { data } =
await client

.from('orders')

.select('*')

.order('id',{ascending:false});

document.getElementById('orders')
.innerHTML='';

data.forEach(order=>{

document.getElementById('orders')
.innerHTML += `

<div class="card">

<h3>طلب #${order.order_number}</h3>

<p>${order.customer_name}</p>

<p>${order.phone}</p>

<p>${order.status}</p>

<button class="start"
onclick="startDelivery(${order.id})">

جاري التوصيل

</button>

<button class="done"
onclick="delivered(${order.id})">

تم التوصيل

</button>

</div>

`;

});

}

window.startDelivery =
async function(id){

await client

.from('orders')

.update({
status:'On The Way'
})

.eq('id',id);

watchId =
navigator.geolocation.watchPosition(

async(position)=>{

await client

.from('orders')

.update({

driver_lat:
position.coords.latitude,

driver_lng:
position.coords.longitude

})

.eq('id',id);

}

);

alert('بدأ التتبع');

}

window.delivered =
async function(id){

navigator.geolocation.clearWatch(watchId);

await client

.from('orders')

.update({
status:'Delivered'
})

.eq('id',id);

alert('تم التوصيل');

}

loadOrders();

setInterval(loadOrders,3000);

</script>

</body>
</html>
