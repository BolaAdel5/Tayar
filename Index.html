<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>طيار</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>

body{
font-family:Arial;
padding:20px;
direction:rtl;
background:#f5f5f5;
}

.box{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
background:black;
color:white;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>
<body>

<div class="box">

<h2>إنشاء طلب</h2>

<input id="name" placeholder="الاسم">

<input id="phone" placeholder="رقم الهاتف">

<button id="sendBtn">
إرسال الطلب
</button>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
'https://ckxljrwcsjmdflxyxxoc.supabase.co';

const supabaseKey =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0';

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

const btn =
document.getElementById("sendBtn");

btn.addEventListener("click", async ()=>{

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

if(!name || !phone){

alert("اكتب البيانات");

return;

}

navigator.geolocation.getCurrentPosition(

async(position)=>{

const orderNumber =
Math.floor(1000 + Math.random()*9000);

const { error } =
await client

.from("orders")

.insert([{

order_number: orderNumber,

customer_name: name,

phone: phone,

customer_lat:
position.coords.latitude,

customer_lng:
position.coords.longitude,

status:"Pending"

}]);

if(error){

console.log(error);

alert(error.message);

return;

}

alert("تم إنشاء الطلب");

window.location.href =
`track.html?order=${orderNumber}`;

},

(error)=>{

console.log(error);

alert("اسمح بالموقع");

}

);

});

</script>
</body>
</html>
