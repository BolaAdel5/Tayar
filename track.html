<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>تتبع الطلب</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
}

#map{
height:100vh;
}

.status{

position:fixed;

top:20px;
right:20px;

background:white;

padding:15px;

border-radius:10px;

z-index:999;

font-size:18px;

box-shadow:0 0 10px rgba(0,0,0,0.2);

}

</style>

</head>

<body>

<div class="status" id="status">
جاري التحميل...
</div>

<div id="map"></div>

<script>

const supabaseUrl =
'https://ckxljrwcsjmdflxyxxoc.supabase.co';

const supabaseKey =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0';

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

const params =
new URLSearchParams(window.location.search);

const orderNumber =
params.get('order');

const map =
L.map('map').setView([30.0444,31.2357],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

let marker;

async function loadOrder(){

const { data,error } =

await client

.from('orders')

.select('*')

.eq('order_number',orderNumber)

.single();

console.log(data,error);

if(error){

document.getElementById('status')
.innerHTML = error.message;

return;

}

if(!data){

document.getElementById('status')
.innerHTML = 'الطلب غير موجود';

return;

}

document.getElementById('status')
.innerHTML = data.status;

if(
data.status !== 'Delivered'
&&
data.driver_lat
){

const latlng = [
data.driver_lat,
data.driver_lng
];

if(marker){

marker.setLatLng(latlng);

}else{

marker =
L.marker(latlng)
.addTo(map);

}

map.setView(latlng,15);

}

if(data.status === 'Delivered'){

if(marker){

map.removeLayer(marker);

marker = null;

}

}

}

loadOrder();

setInterval(loadOrder,3000);

</script>

</body>
</html>
