<!DOCTYPE html>

<style>

<body>

<h2>إنشاء طلب</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<button onclick="createOrder()">
إرسال الطلب
</button>

<script>

const supabase = window.supabase.createClient(
'https://supabase.com/dashboard/project/ckxljrwcsjmdflxyxxoc',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0'
);

async function createOrder(){

navigator.geolocation.getCurrentPosition(async(pos)=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

const orderNumber = Math.floor(1000 + Math.random()*9000);

const { data,error } = await supabase
.from('orders')
.insert([{

order_number: orderNumber,
customer_name: document.getElementById('name').value,
phone: document.getElementById('phone').value,

customer_lat: lat,
customer_lng: lng

}])


window.location =
`track.html?order=${orderNumber}`;

});

}

</script>
